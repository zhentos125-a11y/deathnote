# ============================================================
#  DeathNote — Тетрадь смерти
#  Пакет: indi.f1xal.ru
#
#  Как это работает:
#    1) игрок пишет /deathnote и получает тетрадь;
#    2) открывает её и вписывает ник жертвы;
#    3) нажимает «Готово» (Сохранить содержимое);
#    4) жертва мгновенно погибает, тетрадь очищается.
#  Тетрадь выдаётся полностью пустой — вписывайте что угодно.
#
#  Форматирование текста: MiniMessage
#  https://docs.advntr.dev/minimessage/format.html
# ============================================================

# Префикс перед сообщениями. Может состоять из нескольких строк.
prefix:
  - "<gradient:#8b0000:#ff3b3b><bold>DeathNote</bold></gradient>"
  - "<!italic><gray>indi.f1xal.ru</gray>"

# Пути сообщений, к которым префикс НЕ добавляется
no-prefix:
  - actionbar-received
  - actionbar-success
  - actionbar-empty

# ------------------------------------------------------------
#  Настройки поведения
# ------------------------------------------------------------
settings:
  # Задержка между использованиями тетради, в секундах (0 — без задержки)
  cooldown: 5

  # Разрешить убить самого себя, вписав собственный ник
  allow-self-kill: true

  # Указывать писателя тетради убийцей в стандартном сообщении о смерти
  show-killer: true

  # Право, которое защищает игрока от тетради смерти ("" — выключить)
  immune-permission: "deathnote.immune"

  # Показывать жертве сообщение о том, кто его убил
  victim-message: true

  # Очищать тетрадь, даже если жертва не найдена
  always-clear: true

  # Разрешать тетради выпадать на землю при смерти владельца
  drop-on-death: false

# ------------------------------------------------------------
#  Внешний вид тетради
# ------------------------------------------------------------
item:
  display-name: "<!italic><gradient:#3d0a0a:#a01010><bold>Тетрадь смерти</bold></gradient>"

  # Подпись под ником автора (видна в открытой книге). Пусто — не подписывать.
  author: ""

  lore:
    - "<!italic><gray>Впишите ник жертвы</gray>"
    - "<!italic><gray>и нажмите «Готово»</gray>"
    - ""
    - "<!italic><dark_gray>indi.f1xal.ru"

# ------------------------------------------------------------
#  Сообщения
# ------------------------------------------------------------
messages:
  no-permission: "<red>У вас нет прав на это действие."
  player-only: "<red>Эту команду может выполнить только игрок."
  player-not-found: "<red>Игрок <white><target></white> не найден в сети."
  inventory-full: "<red>У игрока <white><target></white> нет места в инвентаре."
  no-use-permission: "<red>Игрок <white><target></white> не может пользоваться тетрадью."

  given: "<green>Вы получили <white>тетрадь смерти</white>."
  given-other: "<green>Вы выдали тетрадь игроку <white><target></white>."
  given-by: "<green>Вам выдали тетрадь смерти игроком <white><sender></white>."

  actionbar-received: "<gradient:#a01010:#ff3b3b><bold>Тетрадь смерти</bold></gradient> <gray>— впишите ник"

  empty: "<red>Тетрадь пуста. Впишите ник жертвы и нажмите «Готово»."
  actionbar-empty: "<red>Впишите ник жертвы"

  target-not-found: "<red>Игрок <white><target></white> не найден в сети."
  self-kill: "<red>Вы не можете убить себя этой тетрадью."
  immune: "<green>Игроку <white><target></white> тетрадь не подвластна."
  target-safe: "<green>Игрок <white><target></white> в безопасности."
  cooldown: "<red>Подождите <white><time></white> сек. перед следующей записью."

  success: "<green><target> <gray>мгновенно погиб."
  actionbar-success: "<dark_red><bold>СМЕРТЬ</bold></dark_red> <gray>записана"
  victim-message: "<dark_red>Вы были убиты <white><killer></white>."

  reset-done: "<green>Тетрадь очищена."
  nothing-to-reset: "<red>У вас нет тетради смерти."
  reloaded: "<green>Конфигурация перезагружена."
